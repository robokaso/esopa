[tools]
java = "temurin-25"
clojure = "1.12.6.1673"

[tasks.dev]
description = "Start an nREPL-enabled development REPL"
run = "clojure -M:dev:test:nrepl"

[tasks.run]
description = "Run the web server"
run = "clojure -M:run"

[tasks.test]
description = "Run the fast test suite"
run = "clojure -M:test unit"

[tasks."test:watch"]
description = "Rerun the fast test suite on every change (red-green loop)"
run = "clojure -M:test unit --watch"

[tasks."test:generative"]
description = "Run the generative (property-based) tests"
run = "clojure -M:test generative"

[tasks.crap]
description = "Run the fast suite under coverage and report CRAP scores"
run = "clojure -M:crap --coverage-command 'clojure -M:test unit --plugin cloverage'"

[tasks.ci]
description = "The CI build: fast suite under coverage plus the CRAP gate"
depends = ["crap"]
run = "clojure -T:build crap-gate"

[tasks.mutate]
description = "Mutation-test one source file: mise run mutate src/esopa/<file>.clj"
run = "clojure -M:mutate --test-command 'clojure -M:test unit' --coverage-command 'clojure -M:test unit --plugin cloverage' --test-roots test --max-workers 3"

[tasks.outdated]
description = "Report available updates for deps.edn, GitHub Actions and mise tools"
tools = { pinact = "5.0.2" }
quiet = true
run = '''
#!/usr/bin/env bash
set -o pipefail
status=0
echo "== deps.edn (antq; apply with: clojure -M:antq --upgrade)"
clojure -M:antq 2>&1 | grep -v '^SLF4J:' || status=1
echo
echo "== GitHub Actions (pinact; apply with: mise exec pinact@5.0.2 -- pinact run --update)"
pinact run --update --check && echo "All actions are on their latest release." || status=1
echo
echo "== mise tools (apply with: mise upgrade <tool>; raise an exact pin with: mise upgrade --bump <tool>)"
# Ignore config files above the project, such as a mise.toml in the parent directory.
MISE_CEILING_PATHS="$(dirname "$PWD")" mise outdated --bump --local
exit $status
'''

[tasks.uberjar]
description = "Build target/esopa.jar"
run = "clojure -T:build uber"
